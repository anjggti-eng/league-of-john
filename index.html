<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>League of John - PICO-8 Retro Game</title>
	<meta name="description" content="Play League of John, a retro PICO-8 arcade battle game created by William. Controls: Arrows to move, Z/X/C/Space keys to act. Fully responsive and fullscreen.">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	
	<!-- Modern Fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">

	<style type="text/css">
		body {
			margin: 0;
			padding: 0;
			height: 100vh;
			background: radial-gradient(circle at center, #0b121c 0%, #030507 100%);
			color: #f0e6d2;
			font-family: 'Outfit', sans-serif;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			overflow: hidden;
			-webkit-user-select: none;
			-moz-user-select: none;
			-ms-user-select: none;
			user-select: none;
		}

		.game-header {
			text-align: center;
			margin-bottom: 16px;
			transition: opacity 0.3s ease;
			z-index: 10;
		}

		.main-title {
			font-family: 'Cinzel', serif;
			font-size: 28px;
			font-weight: 800;
			color: #f0e6d2;
			text-shadow: 0 0 20px rgba(240, 230, 210, 0.3);
			margin: 0 0 4px 0;
			letter-spacing: 3px;
		}

		.author-tag {
			font-size: 12px;
			color: #c8aa6e;
			margin: 0;
			letter-spacing: 4px;
			text-transform: uppercase;
			font-weight: 600;
		}

		.game-card {
			position: relative;
			background-color: #091420;
			border: 2px solid #c8aa6e;
			border-radius: 8px;
			box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 15px rgba(200, 170, 110, 0.15);
			overflow: hidden;
			display: flex;
			flex-direction: column;
			align-items: center;
			max-width: 100%;
			box-sizing: border-box;
		}

		.canvas-container {
			background-color: #000;
			position: relative;
			display: flex;
			justify-content: center;
			align-items: center;
			width: 512px;
			height: 512px;
			box-sizing: border-box;
		}

		canvas#canvas {
			outline: none;
			cursor: none;
			display: block;
			width: 100%;
			height: 100%;
		}

		.pixels {
			image-rendering: optimizeSpeed;
			image-rendering: -moz-crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}

		.menubar {
			box-sizing: border-box;
			background-color: #091420;
			border-top: 2px solid #785a28;
			display: flex;
			justify-content: space-around;
			align-items: center;
			width: 100%;
			height: 50px;
			padding: 0 16px;
			visibility: hidden;
			opacity: 0;
			transition: opacity 0.3s ease;
		}

		.control-btn {
			background: none;
			border: none;
			outline: none;
			cursor: pointer;
			padding: 8px;
			border-radius: 4px;
			display: flex;
			justify-content: center;
			align-items: center;
			transition: all 0.2s ease;
		}

		.control-btn svg {
			width: 22px;
			height: 22px;
			fill: #a09b8c;
			transition: fill 0.2s ease;
		}

		.control-btn:hover {
			transform: scale(1.15);
		}

		.control-btn:hover svg {
			fill: #c8aa6e;
			filter: drop-shadow(0 0 6px rgba(200, 170, 110, 0.6));
		}

		.control-btn:active {
			transform: scale(0.95);
		}

		/* Fullscreen styling wrapper class */
		.fullscreen-active .game-card {
			border: none;
			border-radius: 0;
			width: 100vw !important;
			height: 100vh !important;
			background-color: #000;
			justify-content: center;
		}

		.fullscreen-active .menubar {
			position: absolute;
			bottom: 0;
			left: 0;
			right: 0;
			background: rgba(9, 20, 32, 0.9);
			border-top: 1px solid rgba(200, 170, 110, 0.3);
			z-index: 10;
		}

		.fullscreen-active .game-header,
		.fullscreen-active .game-footer {
			display: none !important;
		}

		/* Start Overlay */
		.start-overlay {
			position: absolute;
			top: 0; left: 0; right: 0; bottom: 0;
			background: radial-gradient(circle at center, #0e1a29 0%, #030507 100%);
			display: flex;
			justify-content: center;
			align-items: center;
			z-index: 50;
			transition: opacity 0.5s ease, visibility 0.5s ease;
		}

		.start-overlay.fade-out {
			opacity: 0;
			visibility: hidden;
		}

		.start-content {
			text-align: center;
			padding: 20px;
		}

		.overlay-title {
			font-family: 'Cinzel', serif;
			font-size: 32px;
			font-weight: 800;
			color: #f0e6d2;
			text-shadow: 0 0 15px rgba(240, 230, 210, 0.4);
			letter-spacing: 2px;
			margin: 0 0 6px 0;
		}

		.overlay-subtitle {
			font-size: 14px;
			color: #c8aa6e;
			letter-spacing: 4px;
			text-transform: uppercase;
			margin: 0 0 32px 0;
			font-weight: 600;
		}

		.play-btn {
			background: linear-gradient(135deg, #c8aa6e 0%, #a3803e 100%);
			border: 2px solid #785a28;
			color: #091420;
			font-family: 'Outfit', sans-serif;
			font-size: 16px;
			font-weight: 800;
			padding: 12px 32px;
			border-radius: 4px;
			cursor: pointer;
			letter-spacing: 2px;
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			margin: 0 auto 24px auto;
			box-shadow: 0 4px 15px rgba(200, 170, 110, 0.4);
			transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
		}

		.play-btn:hover {
			transform: scale(1.05);
			box-shadow: 0 6px 20px rgba(200, 170, 110, 0.6), 0 0 15px rgba(240, 230, 210, 0.3);
			background: linear-gradient(135deg, #f0e6d2 0%, #c8aa6e 100%);
		}

		.play-btn svg {
			width: 18px;
			height: 18px;
			fill: #091420;
		}

		.instructions-hint {
			font-size: 12px;
			color: #a09b8c;
			letter-spacing: 1px;
		}

		/* Modal style */
		.modal {
			display: none;
			position: absolute;
			top: 0; left: 0; right: 0; bottom: 0;
			background: rgba(3, 5, 7, 0.95);
			z-index: 100;
			justify-content: center;
			align-items: center;
			padding: 20px;
			box-sizing: border-box;
		}

		.modal.show {
			display: flex;
		}

		.modal-content {
			background: #091420;
			border: 2px solid #c8aa6e;
			padding: 24px;
			border-radius: 8px;
			max-width: 320px;
			width: 100%;
			position: relative;
			box-shadow: 0 10px 30px rgba(0,0,0,0.5);
			color: #f0e6d2;
			text-align: center;
		}

		.close-btn {
			position: absolute;
			top: 10px;
			right: 15px;
			font-size: 24px;
			color: #a09b8c;
			cursor: pointer;
			transition: color 0.2s;
		}

		.close-btn:hover {
			color: #c8aa6e;
		}

		.modal-title {
			font-family: 'Cinzel', serif;
			font-size: 18px;
			color: #c8aa6e;
			margin-top: 0;
			margin-bottom: 20px;
			letter-spacing: 1px;
		}

		.control-grid {
			text-align: left;
		}

		.control-row {
			margin-bottom: 12px;
			display: flex;
			align-items: center;
			font-size: 13px;
		}

		.control-row span {
			margin-left: 8px;
		}

		.key {
			background: #1a2a3a;
			border: 1px solid #785a28;
			border-radius: 4px;
			padding: 2px 6px;
			font-size: 11px;
			font-family: monospace;
			color: #c8aa6e;
			display: inline-block;
			min-width: 16px;
			text-align: center;
		}

		.game-footer {
			margin-top: 16px;
			font-size: 11px;
			color: #525861;
			letter-spacing: 1px;
			text-align: center;
			transition: opacity 0.3s ease;
			z-index: 10;
		}
	</style>
</head>

<body>

	<header class="game-header">
		<h1 class="main-title">LEAGUE OF JOHN</h1>
		<p class="author-tag">by William</p>
	</header>

	<main id="game-card" class="game-card">
		
		<!-- The Start Screen Overlay -->
		<div id="start-screen" class="start-overlay">
			<div class="start-content">
				<h1 class="overlay-title">LEAGUE OF JOHN</h1>
				<p class="overlay-subtitle">by William</p>
				<button class="play-btn" id="play-btn" onclick="startGame()">
					<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
					PLAY
				</button>
				<div class="instructions-hint">Use Keyboard or Gamepad to Play</div>
			</div>
		</div>

		<!-- Help Modal Overlay -->
		<div id="help-modal" class="modal">
			<div class="modal-content">
				<span class="close-btn" onclick="toggleControlsHelp()">&times;</span>
				<h3 class="modal-title">KEYBOARD CONTROLS</h3>
				<div class="control-grid">
					<div class="control-row">
						<span class="key">▲</span><span class="key">▼</span><span class="key">◀</span><span class="key">▶</span>
						<span>Move Hero</span>
					</div>
					<div class="control-row">
						<span class="key">Z</span> <span class="key">C</span> <span class="key">Space</span>
						<span>Attack / Confirm (O)</span>
					</div>
					<div class="control-row">
						<span class="key">X</span> <span class="key">V</span>
						<span>Special / Cancel (X)</span>
					</div>
					<div class="control-row">
						<span class="key">Enter</span> <span class="key">P</span>
						<span>Pause / Menu</span>
					</div>
				</div>
			</div>
		</div>


		<div id="canvas-container" class="canvas-container">
			<canvas class="emscripten pixels" id="canvas" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
		</div>

		<div id="menubar" class="menubar">
			<button class="control-btn" onclick="Module.pico8Reset();" title="Reset Game">
				<svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
			</button>

			<button class="control-btn" id="btn-pause" onclick="togglePauseBtn();" title="Pause Game">
				<svg viewBox="0 0 24 24" id="svg-pause"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
			</button>

			<button class="control-btn" onclick="toggleFullscreen();" title="Fullscreen Mode">
				<svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
			</button>

			<button class="control-btn" id="btn-sound" onclick="toggleSoundBtn();" title="Mute/Unmute">
				<svg viewBox="0 0 24 24" id="svg-sound"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
			</button>

			<button class="control-btn" onclick="toggleControlsHelp();" title="Keyboard Controls Help">
				<svg viewBox="0 0 24 24"><path d="M20 5H4c-1.1 0-1.99.9-1.99 2L2 17c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-3 0h2v2H5v-2zm0-3h2v2H5V8zm12 7H7v-2h10v2zm0-4h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg>
			</button>
		</div>

	</main>

	<footer class="game-footer">
		<p>Powered by PICO-8 Emulator | League of John Edition</p>
	</footer>

	<script type="text/javascript">
		var autoresize = false; 
		var autoplay = true; 

		var canvas = document.getElementById("canvas");
		var container = document.getElementById("canvas-container");
		var card = document.getElementById("game-card");

		var Module = {};
		Module.canvas = canvas;

		// Key blocker to prevent scrolling while playing
		function onKeyDown_blocker(event) {
			event = event || window.event;
			var o = document.activeElement;
			if (!o || o == document.body || o.tagName == "canvas" || o.tagName == "CANVAS") {
				if ([9, 32, 37, 38, 39, 40].indexOf(event.keyCode) > -1) {
					if (event.preventDefault) event.preventDefault();
				}
			}
		}
		document.addEventListener('keydown', onKeyDown_blocker, false);

		//------------------------- RESIZE
		function resizeCanvas() {
			var width = window.innerWidth;
			var height = window.innerHeight;
			
			var fs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
			
			var size;
			if (fs) {
				// In fullscreen, fill screen as much as possible, leaving room for menubar (50px)
				size = Math.min(width, height - 50);
			} else {
				// Non-fullscreen layout
				var maxW = width - 32; // 16px horizontal margins
				var maxH = height - 160; // leave room for header & menubar & margins
				
				size = Math.min(512, Math.min(maxW, maxH));
				if (size < 128) size = 128;
			}
			
			container.style.width = size + "px";
			container.style.height = size + "px";
			
			canvas.style.width = "100%";
			canvas.style.height = "100%";
			
			window.focus();
		}

		window.addEventListener('load', resizeCanvas, false);
		window.addEventListener('resize', resizeCanvas, false);
		window.addEventListener('orientationchange', resizeCanvas, false);

		// Listen for fullscreen change events to update body class
		function onFullscreenChange() {
			var fs = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
			if (fs) {
				document.body.classList.add("fullscreen-active");
			} else {
				document.body.classList.remove("fullscreen-active");
			}
			resizeCanvas();
		}
		document.addEventListener('fullscreenchange', onFullscreenChange, false);
		document.addEventListener('webkitfullscreenchange', onFullscreenChange, false);
		document.addEventListener('mozfullscreenchange', onFullscreenChange, false);
		document.addEventListener('MSFullscreenChange', onFullscreenChange, false);

		//------------------------- FULLSCREEN
		function toggleFullscreen() {
			var isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);
			
			if (isFullscreen) {
				if (document.exitFullscreen) {
					document.exitFullscreen();
				} else if (document.webkitExitFullscreen) {
					document.webkitExitFullscreen();
				} else if (document.mozCancelFullScreen) {
					document.mozCancelFullScreen();
				} else if (document.msExitFullscreen) {
					document.msExitFullscreen();
				}
			} else {
				if (card.requestFullscreen) {
					card.requestFullscreen();
				} else if (card.webkitRequestFullscreen) {
					card.webkitRequestFullscreen();
				} else if (card.mozRequestFullScreen) {
					card.mozRequestFullScreen();
				} else if (card.msRequestFullscreen) {
					card.msRequestFullscreen();
				}
			}
		}

		//------------------------- CONTROLS HELPER
		function toggleControlsHelp() {
			var modal = document.getElementById("help-modal");
			modal.classList.toggle("show");
		}

		//------------------------- SOUND TOGGLE JS
		var isMuted = false;
		function toggleSoundBtn() {
			Module.pico8ToggleSound();
			isMuted = !isMuted;
			var svg = document.getElementById("svg-sound");
			if (isMuted) {
				svg.innerHTML = '<path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.21.05-.42.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>';
			} else {
				svg.innerHTML = '<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>';
			}
		}

		//------------------------- PAUSE TOGGLE JS
		var isPaused = false;
		function togglePauseBtn() {
			Module.pico8TogglePaused();
			isPaused = !isPaused;
			var svg = document.getElementById("svg-pause");
			if (isPaused) {
				svg.innerHTML = '<path d="M8 5v14l11-7z"/>';
			} else {
				svg.innerHTML = '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>';
			}
		}

		//------------------------- GAMEPAD SUPPORT (krajzeg's)
		var supportedPlayers = 2;
		var mapFaceButtons = true;
		var mapShoulderButtons = true;
		var mapTriggerButtons = false;
		var mapStickButtons = false;
		var stickDeadzone = 0.4;
		var pico8_buttons = [0,0,0,0,0,0,0,0];

		if (navigator.getGamepads)
			requestAnimationFrame(updateGamepads);

		function updateGamepads() {
			var gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
			for (var p = 0; p < supportedPlayers; p++)
				pico8_buttons[p] = 0;
			for (var i = 0; i < gamepads.length; i++) {
				var gp = gamepads[i];
				if (!gp || !gp.connected) continue;
				var player = i % supportedPlayers;
				var bitmask = 0;
				bitmask |= (axis(gp,0) < -stickDeadzone || axis(gp,2) < -stickDeadzone || btn(gp,14)) ? 1 : 0;
				bitmask |= (axis(gp,0) > +stickDeadzone || axis(gp,2) > +stickDeadzone || btn(gp,15)) ? 2 : 0;
				bitmask |= (axis(gp,1) < -stickDeadzone || axis(gp,3) < -stickDeadzone || btn(gp,12)) ? 4 : 0;
				bitmask |= (axis(gp,1) > +stickDeadzone || axis(gp,3) > +stickDeadzone || btn(gp,13)) ? 8 : 0;
				var pressedO = (mapFaceButtons && (btn(gp,0) || btn(gp,2))) || (mapShoulderButtons && btn(gp,5)) || (mapTriggerButtons && btn(gp,7)) || (mapStickButtons && btn(gp,11));
				var pressedX = (mapFaceButtons && (btn(gp,1) || btn(gp,3))) || (mapShoulderButtons && btn(gp,4)) || (mapTriggerButtons && btn(gp,6)) || (mapStickButtons && btn(gp,10));
				bitmask |= pressedO ? 16 : 0;
				bitmask |= pressedX ? 32 : 0;
				pico8_buttons[player] |= bitmask;
				pico8_buttons[0] |= (btn(gp,8) || btn(gp,9)) ? 64 : 0;
			}
			requestAnimationFrame(updateGamepads);
		}

		function axis(gp,n) { return gp.axes[n] || 0.0; }
		function btn(gp,b) { return gp.buttons[b] ? gp.buttons[b].pressed : false; }

		//------------------------- LOADER
		var cartLoaded = false;

		function loadCart() {
			if (cartLoaded) return;
			
			var script = document.createElement('script');
			script.type = 'text/javascript';
			script.async = true;
			script.src = "index.js";

			var loadFunction = function () {
				cartLoaded = true;
				var menubar = document.getElementById("menubar");
				menubar.style.visibility = "visible";
				menubar.style.opacity = "1";
				resizeCanvas();
			}
			script.onload = loadFunction;
			script.onreadystatechange = loadFunction;

			var s = document.getElementsByTagName('script')[0];
			s.parentNode.insertBefore(script, s);
		}

		function startGame() {
			var overlay = document.getElementById("start-screen");
			overlay.classList.add("fade-out");
			
			// Resume/start AudioContext for Chrome autoplay policies
			var AudioContext = window.AudioContext || window.webkitAudioContext;
			if (AudioContext) {
				var context = new AudioContext();
				if (context.state === 'suspended') {
					context.resume();
				}
			}
			loadCart();
		}

		if (autoplay) {
			var AudioContext = window.AudioContext || window.webkitAudioContext;
			if (AudioContext) {
				var context = new AudioContext();
				context.onstatechange = function () {
					if (context.state == 'running') {
						startGame();
						context.close();
					}
				};
			}
		}
	</script>
</body>
